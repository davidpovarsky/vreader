name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/unsigned-ipa-latest
      - chatgpt/native-ios-shell

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun swift --version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Apply preview compile patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci-preview-compile-patches.py

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project vreader.xcodeproj \
            -scheme vreader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build 2>&1 | tee build/xcodebuild.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$PWD/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 2 -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "No .app was produced."
            find "$PWD/build/DerivedData/Build/Products" -maxdepth 4 -type d -name '*.app' -print || true
            exit 1
          fi

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/vreader.app

          (
            cd build/ipa
            /usr/bin/zip -qry ../vreader-unsigned.ipa Payload
          )

          ls -lh build/vreader-unsigned.ipa

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vreader-unsigned-ipa
          path: |
            build/vreader-unsigned.ipa
            build/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
