name: Build original UI iOS 26 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/original-ui-ios26

permissions:
  contents: read

concurrency:
  group: original-ui-ios26-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build original UI with Xcode 26
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode 26 installation found on runner."
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun swift --version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $SDK_VERSION"
          case "$SDK_VERSION" in
            26.*) ;;
            *) echo "Expected an iOS 26 SDK, got $SDK_VERSION"; exit 1 ;;
          esac

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Apply preview compile patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci-preview-compile-patches.py

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml

      - name: Build unsigned app against iOS 26 SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project vreader.xcodeproj \
            -scheme vreader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build 2>&1 | tee build/xcodebuild.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$PWD/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 2 -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "No .app was produced."
            find "$PWD/build/DerivedData/Build/Products" -maxdepth 4 -type d -name '*.app' -print || true
            exit 1
          fi

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/vreader.app

          (
            cd build/ipa
            /usr/bin/zip -qry ../vreader-original-ui-ios26-unsigned.ipa Payload
          )

          ls -lh build/vreader-original-ui-ios26-unsigned.ipa

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vreader-original-ui-ios26-unsigned
          path: |
            build/vreader-original-ui-ios26-unsigned.ipa
            build/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
