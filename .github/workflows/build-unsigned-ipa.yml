name: Build original UI iOS 27 IPA

on:
  workflow_dispatch:
    inputs:
      run_feature_177_core_tests:
        description: Run the focused Feature 177 structured-document contracts
        required: false
        default: false
        type: boolean
      run_feature_177_mapping_tests:
        description: Run the focused Feature 177 WI-3 document-mapping contracts
        required: false
        default: false
        type: boolean
  push:
    branches:
      - chatgpt/original-ui-ios26

permissions:
  contents: read

concurrency:
  group: original-ui-ios26-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build original UI with Xcode 27
    runs-on: xcode-27
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode 27 installation found on runner."
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun swift --version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $SDK_VERSION"
          case "$SDK_VERSION" in
            27.*) ;;
            *) echo "Expected an iOS 27 SDK, got $SDK_VERSION"; exit 1 ;;
          esac

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Install Metal Toolchain for MLX
        if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.run_feature_177_core_tests && !inputs.run_feature_177_mapping_tests) }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain

      - name: Apply preview compile patches
        if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.run_feature_177_core_tests && !inputs.run_feature_177_mapping_tests) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci-preview-compile-patches.py

      - name: Generate Xcode project
        if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.run_feature_177_core_tests && !inputs.run_feature_177_mapping_tests) }}
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml

      - name: Generate Feature 177 core Xcode project
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_feature_177_core_tests }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/Feature177Project
          xcodegen generate \
            --spec Feature177Core.project.yml \
            --project build/Feature177Project

      - name: Generate Feature 177 mapping Xcode project
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_feature_177_mapping_tests }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/Feature177MappingProject
          xcodegen generate \
            --spec Feature177Mapping.project.yml \
            --project build/Feature177MappingProject

      - name: Build unsigned app against iOS 27 SDK
        if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.run_feature_177_core_tests && !inputs.run_feature_177_mapping_tests) }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project vreader.xcodeproj \
            -scheme vreader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build 2>&1 | tee build/xcodebuild.log

      - name: Boot iOS 27 Simulator for Feature 177 tests
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_feature_177_core_tests || inputs.run_feature_177_mapping_tests) }}
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_ID="$(xcrun simctl list runtimes available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin).get("runtimes", [])
          matches = [r for r in runtimes if r.get("isAvailable") and r.get("name", "").startswith("iOS 27")]
          if not matches:
              raise SystemExit("No available iOS 27 Simulator runtime")
          print(matches[-1]["identifier"])
          ')"
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          payload = json.load(sys.stdin).get("devices", {})
          runtime = sys.argv[1]
          matches = [d for d in payload.get(runtime, []) if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]
          if not matches:
              raise SystemExit(f"No available iPhone Simulator for {runtime}")
          print(matches[0]["udid"])
          ' "${RUNTIME_ID}")"
          echo "FEATURE_TEST_UDID=${UDID}" >> "$GITHUB_ENV"
          xcrun simctl boot "${UDID}"
          xcrun simctl bootstatus "${UDID}" -b

      - name: Compile Feature 177 contracts against iOS 27 SDK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_feature_177_core_tests }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project build/Feature177Project/Feature177Core.xcodeproj \
            -scheme Feature177Core \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${FEATURE_TEST_UDID}" \
            -derivedDataPath "$PWD/build/Feature177DerivedData" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -only-testing:Feature177CoreTests \
            ENABLE_TESTABILITY=YES \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build/feature-177-contract-compile.log

      - name: Run Feature 177 core contract tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_feature_177_core_tests }}
        shell: bash
        env:
          TEST_UDID: ${{ env.FEATURE_TEST_UDID }}
          TEST_LOG_PATH: ${{ github.workspace }}/build/feature-177-core-tests.log
          TEST_CONFIGURATION: Release
          TEST_ENABLE_TESTABILITY: YES
          TEST_ONLY_ACTIVE_ARCH: YES
          TEST_XCODEBUILD_ACTION: test-without-building
          TEST_PROJECT: ${{ github.workspace }}/build/Feature177Project/Feature177Core.xcodeproj
          TEST_SCHEME: Feature177Core
          TEST_DERIVED_DATA_PATH: ${{ github.workspace }}/build/Feature177DerivedData
          TEST_RESULT_BUNDLE_PATH: ${{ github.workspace }}/build/Feature177CoreTests.xcresult
          TEST_COLLECT_DIAGNOSTICS: never
          # The preceding build-for-testing owns compilation. This watchdog
          # now covers only installing and running the two focused suites.
          TIMEOUT_SECS: 300
        run: |
          set -euo pipefail
          scripts/run-tests.sh \
            Feature177CoreTests

      - name: Compile Feature 177 mapping contracts against iOS 27 SDK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_feature_177_mapping_tests }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project build/Feature177MappingProject/Feature177Mapping.xcodeproj \
            -scheme Feature177Mapping \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${FEATURE_TEST_UDID}" \
            -derivedDataPath "$PWD/build/Feature177MappingDerivedData" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -only-testing:Feature177MappingTests \
            ENABLE_TESTABILITY=YES \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build/feature-177-mapping-compile.log

      - name: Run Feature 177 mapping tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_feature_177_mapping_tests }}
        shell: bash
        env:
          TEST_UDID: ${{ env.FEATURE_TEST_UDID }}
          TEST_LOG_PATH: ${{ github.workspace }}/build/feature-177-mapping-tests.log
          TEST_CONFIGURATION: Release
          TEST_ENABLE_TESTABILITY: YES
          TEST_ONLY_ACTIVE_ARCH: YES
          TEST_XCODEBUILD_ACTION: test-without-building
          TEST_PROJECT: ${{ github.workspace }}/build/Feature177MappingProject/Feature177Mapping.xcodeproj
          TEST_SCHEME: Feature177Mapping
          TEST_DERIVED_DATA_PATH: ${{ github.workspace }}/build/Feature177MappingDerivedData
          TEST_RESULT_BUNDLE_PATH: ${{ github.workspace }}/build/Feature177MappingTests.xcresult
          TEST_COLLECT_DIAGNOSTICS: never
          TIMEOUT_SECS: 300
        run: |
          set -euo pipefail
          scripts/run-tests.sh \
            Feature177MappingTests

      - name: Shut down Feature 177 test Simulator
        if: ${{ always() && env.FEATURE_TEST_UDID != '' }}
        shell: bash
        run: |
          xcrun simctl shutdown "${FEATURE_TEST_UDID}" 2>/dev/null || true

      - name: Package unsigned IPA
        if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.run_feature_177_core_tests && !inputs.run_feature_177_mapping_tests) }}
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$PWD/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 2 -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "No .app was produced."
            find "$PWD/build/DerivedData/Build/Products" -maxdepth 4 -type d -name '*.app' -print || true
            exit 1
          fi

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/vreader.app

          (
            cd build/ipa
            /usr/bin/zip -qry ../vreader-original-ui-ios27-unsigned.ipa Payload
          )

          ls -lh build/vreader-original-ui-ios27-unsigned.ipa

      - name: Upload unsigned IPA artifact
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || (!inputs.run_feature_177_core_tests && !inputs.run_feature_177_mapping_tests)) }}
        uses: actions/upload-artifact@v4
        with:
          name: vreader-original-ui-ios27-unsigned
          path: |
            build/vreader-original-ui-ios27-unsigned.ipa
            build/xcodebuild.log
            vreader.xcodeproj/project.pbxproj
            vreader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Feature 177 test artifact
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_feature_177_core_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: feature-177-core-tests
          path: |
            build/feature-177-contract-compile.log
            build/feature-177-core-tests.log
            build/Feature177CoreTests.xcresult
            build/Feature177Project/Feature177Core.xcodeproj/project.pbxproj
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Feature 177 mapping test artifact
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_feature_177_mapping_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: feature-177-mapping-tests
          path: |
            build/feature-177-mapping-compile.log
            build/feature-177-mapping-tests.log
            build/Feature177MappingTests.xcresult
            build/Feature177MappingProject/Feature177Mapping.xcodeproj/project.pbxproj
          if-no-files-found: warn
          retention-days: 14
