name: Feature177Core
options:
  bundleIdPrefix: com.vreader
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  # Logic-test bundle over the exact production files consumed by the app.
  # This standalone project intentionally has no package graph or host app.
  Feature177CoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: vreader/Features/AIAgent/Core
      - path: vreader/Models/BookFormat.swift
      - path: vreader/Models/DocumentFingerprint.swift
      - path: vreader/Models/FormatCapabilities.swift
      - path: vreader/Models/Locator.swift
      - path: vreader/Services/AI/ChapterBounds.swift
      - path: vreaderTests/Features/AIAgent/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vreader.feature177-core-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FEATURE_177_CORE_TESTS"

schemes:
  Feature177Core:
    build:
      targets:
        Feature177CoreTests: testing
      buildImplicitDependencies: false
    test:
      config: Release
      targets:
        - Feature177CoreTests
